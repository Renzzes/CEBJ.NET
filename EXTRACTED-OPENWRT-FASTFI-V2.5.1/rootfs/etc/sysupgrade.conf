# FastFi — files preserved across a full sysupgrade (.bin firmware update).
# Without this list, `sysupgrade -c` wipes /www/data (the operator's customer,
# sales, points, and billing databases) and /etc/fastfi (device key,
# shield/billing config, rollback marker). Preserving them is essential:
#   * operator data survives firmware updates
#   * the pre-OTA backup + ota_pending rollback marker survive so the
#     post-OTA watchdog can roll a bad update back.
# /etc/config is preserved automatically by `sysupgrade -c`.
/etc/fastfi/
/www/data/

# Remote Access / VPN state (load-bearing flags + creds). rc.local and the
# every-minute VPN cron gate on /etc/fastfi_vpn_enabled; losing it after an
# OTA means nothing ever redials - the "Remote Access down after update
# until I reconnect manually" complaint. sysupgrade -c's /etc heuristic is
# unreliable for these, so list them explicitly.
/etc/fastfi_vpn_enabled
/etc/fastfi_enrolled
/etc/fastfi_remote_token
/etc/fastfi_admin_pass.conf
/etc/fastfi_rates.conf
/etc/fastfi-vpn-auth.txt
/etc/openvpn/