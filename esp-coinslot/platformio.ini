; KonekSik-Fi / FastFi multi-board coinslot firmware
; Build: pio run -e esp8266_lanbase_w5500
; Upload: pio run -e esp8266_lanbase_w5500 -t upload

[platformio]
default_envs = esp8266_lanbase_w5500
src_dir = src
include_dir = include

[env]
framework = arduino
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=0

; ----- ESP8266 + W5500 (production lanbase pinout) -----
[env:esp8266_lanbase_w5500]
platform = espressif8266
board = nodemcuv2
lib_deps =
  arduino-libraries/Ethernet@^2.0.2
build_flags =
  ${env.build_flags}
  -DBOARD_ESP8266_LANBASE_W5500=1
  -DBOARD_ID=\"esp8266_lanbase_w5500\"

; ----- ESP8266 WiFi -----
[env:esp8266_wifi]
platform = espressif8266
board = nodemcuv2
build_flags =
  ${env.build_flags}
  -DBOARD_ESP8266_WIFI=1
  -DBOARD_ID=\"esp8266_wifi\"

; ----- ESP32 + W5500 -----
[env:esp32_w5500]
platform = espressif32
board = esp32dev
lib_deps =
  arduino-libraries/Ethernet@^2.0.2
build_flags =
  ${env.build_flags}
  -DBOARD_ESP32_W5500=1
  -DBOARD_ID=\"esp32_w5500\"

; ----- ESP32-S3 + W5500 -----
[env:esp32s3_w5500]
platform = espressif32
board = esp32-s3-devkitc-1
lib_deps =
  arduino-libraries/Ethernet@^2.0.2
build_flags =
  ${env.build_flags}
  -DBOARD_ESP32S3_W5500=1
  -DBOARD_ID=\"esp32s3_w5500\"

; ----- ESP32 native Ethernet -----
[env:esp32_eth]
platform = espressif32
board = esp32dev
build_flags =
  ${env.build_flags}
  -DBOARD_ESP32_ETH=1
  -DBOARD_ID=\"esp32_eth\"
